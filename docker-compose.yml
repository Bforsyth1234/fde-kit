services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: fde-phoenix
    ports:
      - "6006:6006"   # UI + OTLP/HTTP collector at /v1/traces
      - "4317:4317"   # OTLP/gRPC (unused by the kit, handy for other tools)
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

  temporal:
    # Single-binary dev server: server + in-memory persistence + web UI. Not for production.
    # Histories live in memory and are lost on `make down`. The image runs as a non-root
    # user, so an on-disk --db-filename under a named volume fails with SQLite "unable to
    # open database file (14)"; in-memory is the fix and is all the demos and tests need.
    image: temporalio/temporal:latest
    container_name: fde-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC frontend (workers and clients connect here)
      - "8233:8233"   # web UI
    restart: unless-stopped

  postgres:
    # Shared tool-idempotency journal for durable runs, and the multi-tenant retrieval store
    # (pgvector >= 0.8 for iterative index scans). `fde rag migrate` creates the RAG roles.
    image: pgvector/pgvector:pg16
    container_name: fde-postgres
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: fde
      POSTGRES_DB: fde
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  phoenix-data:
  postgres-data:
