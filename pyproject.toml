[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-kit"
version = "0.1.0"
description = "A slim, opinionated starter kit for deploying LLM agents: agent loop, tool registry, OpenTelemetry tracing, eval harness with a CI gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brooks Forsyth" }]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "rich>=13.7",
]

[project.optional-dependencies]
durable = [
    "temporalio>=1.8",
    "psycopg[binary,pool]>=3.1",
    "cryptography>=42",
]
rag = [
    "psycopg[binary,pool]>=3.1",
    "fastembed>=0.4",
]
dev = [
    "temporalio>=1.8",
    "psycopg[binary,pool]>=3.1",
    "cryptography>=42",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
fde = "fde_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["durable: needs a local Temporal dev server (downloaded on first use)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Lease and policy prose: wrapping it would change the documents being retrieved.
"src/fde_kit/rag/demo_corpus.py" = ["E501"]
