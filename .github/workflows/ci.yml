name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: fde
          POSTGRES_DB: fde
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=fde_kit --cov-report=term-missing
        env:
          FDE_TEST_PG_URL: postgresql://fde:fde@localhost:5432/fde
      - name: retrieval eval (hash embedder, offline) and tenant-leak gate
        run: python -m evals.rag_eval --embedder hash --threshold 0.8
        env:
          FDE_RAG_ADMIN_URL: postgresql://fde:fde@localhost:5432/fde
      - name: offline eval (harness self-check)
        run: python -m evals.run_evals --provider mock --threshold 1.0
        env:
          FDE_OTEL_ENABLED: "false"
      - name: seed the demo lease corpus (hash embedder, offline)
        run: fde rag seed-demo
        env:
          FDE_RAG_ADMIN_URL: postgresql://fde:fde@localhost:5432/fde
          FDE_RAG_EMBEDDER: hash
          FDE_OTEL_ENABLED: "false"
      - name: rag eval (scripted model, real tools against Postgres under RLS)
        run: python -m evals.run_evals --set rag --provider mock --threshold 1.0
        env:
          FDE_RAG_ADMIN_URL: postgresql://fde:fde@localhost:5432/fde
          FDE_RAG_EMBEDDER: hash
          FDE_OTEL_ENABLED: "false"
      - name: edgar eval (seed pharma-a/pharma-b from offline fixtures, scripted model, real tools)
        # --seed ingests the pinned filings from evals/fixtures/edgar/cache: no network, no
        # contact string. Idempotent, so it is safe on a database that is already seeded.
        run: python -m evals.run_evals --set edgar --seed --provider mock --threshold 1.0
        env:
          FDE_RAG_ADMIN_URL: postgresql://fde:fde@localhost:5432/fde
          FDE_RAG_EMBEDDER: hash
          FDE_OTEL_ENABLED: "false"
      - name: wrangle (dry-run each fixture spec, then approve a copy and apply each twice into wrangle-ci)
        # The dry runs need no database and use the committed (unapproved) specs; each exits
        # 1 on a SpecMismatch or a spec error. The committed specs are unapproved, so approve a
        # copy. The second apply of each spec must be a no-op (idempotent): `fde wrangle apply`
        # exits 1 if any gate refuses.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          specs="erp_shipments:erp_shipments.csv planner_forecast:planner_forecast.xlsx legacy_report:legacy_report.csv"
          for pair in $specs; do
            echo "::group::dry-run ${pair%%:*}"
            fde wrangle dry-run "tests/fixtures/wrangle/project/specs/${pair%%:*}.yaml" \
              "tests/fixtures/wrangle/${pair#*:}" --out "$work/dry/${pair%%:*}"
            echo "::endgroup::"
          done
          cp -r tests/fixtures/wrangle/project "$work/project"
          fde rag migrate
          fde rag create-tenant wrangle-ci --name "Wrangle CI"
          for pair in $specs; do
            fde wrangle approve "$work/project/specs/${pair%%:*}.yaml" --by ci
          done
          count_facts() {
            psql "$FDE_RAG_ADMIN_URL" -tAc \
              "SELECT count(*) FROM rag_facts WHERE tenant_id = 'wrangle-ci'"
          }
          for pass in 1 2; do
            for pair in $specs; do
              echo "::group::apply ${pair%%:*} (pass $pass)"
              fde wrangle apply "$work/project/specs/${pair%%:*}.yaml" \
                "tests/fixtures/wrangle/${pair#*:}" --tenant wrangle-ci --out "$work/out/${pair%%:*}"
              echo "::endgroup::"
            done
            counts[$pass]="$(count_facts)"
            echo "facts in wrangle-ci after pass $pass: ${counts[$pass]}"
          done
          # 59 ERP + 35 planner + 96 legacy (tests/fixtures/wrangle/README.md); the re-run adds none.
          test "${counts[1]}" = 190
          test "${counts[2]}" = "${counts[1]}"
        env:
          FDE_RAG_ADMIN_URL: postgresql://fde:fde@localhost:5432/fde
          FDE_RAG_EMBEDDER: hash
          FDE_OTEL_ENABLED: "false"
          COLUMNS: "160"

  eval:
    # The real gate. Runs only when the repo has an API key secret, so forks and PRs from
    # outside still get the test job above.
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: golden eval against the real model
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python -m evals.run_evals --json eval-results.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FDE_OTEL_ENABLED: "false"
      - name: skipped (no ANTHROPIC_API_KEY secret)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY secret not set; real-model eval skipped."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('eval-results.json') != '' }}
        with:
          name: eval-results
          path: eval-results.json
