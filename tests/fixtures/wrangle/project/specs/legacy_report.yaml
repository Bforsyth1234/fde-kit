spec: legacy_report
version: 1
dictionary: ../dictionary.yaml
crosswalks:
  plants: {path: ../crosswalks/plants.csv, kind: plant}

source:
  header_rows: [1]
  encoding: utf-8-sig
  delimiter: ";"

entity:
  kind: plant
  parts:
    - column: Plant
      ops: [{op: text, strip: true}]
      resolve: {crosswalk: plants, policy: closed, fuzzy: false}

period:
  column:
    name: Report Date
    ops: [{op: text, strip: true}, {op: date, format: "%d/%m/%Y"}]
    grain: month

measures:
  - field: shipped_units
    column: Shipped (000s)
    ops: [{op: number, thousands: ".", decimal: ","}]
    scale: 1000
    precision: 1000
    unit: units
  - field: returned_units
    column: Returns
    ops: [{op: number, thousands: ".", decimal: ",", parens_negative: true}]
    unit: units
  - field: revenue_eur
    column: Revenue (EUR)
    ops: [{op: number, thousands: ".", decimal: ","}]
    unit: EUR

notes: |
  Legacy European export: ';' delimiter, '.' thousands, ',' decimal, UTF-8 with BOM.
  Report Date is the month-end date as DD/MM/YYYY. Shipped is in thousands with one decimal
  (scale 1000, precision 1000). Returns are shown in parentheses, e.g. "(1.204)" = -1204.
  Plant codes are the legacy DET-07 style; GRR-03 (Grand Rapids, closed 2025) is not in the
  crosswalk and is rejected on purpose.
