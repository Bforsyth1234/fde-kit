spec: formulas
version: 1
dictionary: ../dictionary.yaml

source:
  sheet: Calc
  header_rows: [2]
  skip_rows:
    - {column: Item, matches: "(?i)^total$"}

entity:
  kind: item
  parts:
    - column: Item
      ops: [{op: text, strip: true}]
      resolve: {policy: open}

period:
  cell:
    ref: A1
    ops:
      - {op: regex, pattern: "Period: (.+)"}
      - {op: period, format: "%b %Y", grain: month}

measures:
  - field: line_total_usd
    column: Total
    ops: [{op: number}]
    unit: USD

notes: |
  Saved by LibreOffice, so formula cells carry cached values, except D4 (cached value removed
  on purpose: formula_no_value, must be a reject and never a 0) and D6 (#DIV/0!: error cell).
  Expected reject rate is 50%, so apply refuses this spec under the default gate; it exists
  for dry-run and read tests.
